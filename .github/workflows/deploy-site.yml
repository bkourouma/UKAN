# Construit le site Next.js (export statique) et le publie sur le serveur
# de ukan.allianceconsultants.net par SSH (rsync).
#
# Secrets à créer dans GitHub › Settings › Secrets and variables › Actions :
#   DEPLOY_HOST         nom ou IP du serveur
#   DEPLOY_USER         utilisateur SSH dédié au déploiement
#   DEPLOY_SSH_KEY      clé privée SSH de cet utilisateur (sans phrase de passe)
#   DEPLOY_KNOWN_HOSTS  empreinte du serveur : sortie de `ssh-keyscan -H <hôte>`
#   DEPLOY_PATH         dossier servi par Nginx, ex. /var/www/ukan.allianceconsultants.net
# Facultatif :
#   DEPLOY_PORT         port SSH (22 par défaut)
#
# Mode d’emploi complet : site/ukan-nextjs/deploy/README.md

name: Déployer le site

on:
  push:
    branches: [main]
    paths:
      - "site/ukan-nextjs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_DIR: site/ukan-nextjs
  SITE_URL: https://ukan.allianceconsultants.net

jobs:
  build:
    name: Construire
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SITE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Construire l’export statique
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ env.SITE_DIR }}/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publier
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Préparer la connexion SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Envoyer les fichiers (rsync)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          rsync -rlptz --delete --delay-updates \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            out/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Vérifier que le site répond
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/") && [ "$code" = 200 ] && { echo "En ligne : $SITE_URL"; exit 0; }
            echo "Réponse $code, nouvel essai…"; sleep 5
          done
          echo "::error::$SITE_URL ne répond pas 200 après le déploiement."
          exit 1

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
