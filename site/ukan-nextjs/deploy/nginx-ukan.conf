# Nginx : site statique UKAN (export Next.js avec trailingSlash).
# À placer dans /etc/nginx/sites-available/ukan.allianceconsultants.net
# puis : ln -s ../sites-available/ukan.allianceconsultants.net /etc/nginx/sites-enabled/
# Le bloc HTTPS (certificat) est ajouté par certbot --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name ukan.allianceconsultants.net;

    root /var/www/ukan.allianceconsultants.net;
    index index.html;

    # Redirections relatives (/le-reseau → /le-reseau/), justes derrière un proxy ou en HTTPS
    absolute_redirect off;

    # /le-reseau  →  /le-reseau/  →  /le-reseau/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Fichiers versionnés par Next.js : cache long
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Pages HTML : toujours revalidées, pour voir chaque déploiement aussitôt
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
