# Nginx de l'HÔTE pour ukan.allianceconsultants.net — site UKAN Côte d'Ivoire
# (conteneur Docker « ukan-site », port local 3040).
# À installer dans /etc/nginx/sites-available/ukan.allianceconsultants.net
# puis : ln -s ../sites-available/ukan.allianceconsultants.net /etc/nginx/sites-enabled/
# Non touché par le déploiement automatique.

upstream ukan_site {
    server 127.0.0.1:3040;
    keepalive 16;
}

# HTTP : défi Let's Encrypt, puis redirection vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ukan.allianceconsultants.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://ukan.allianceconsultants.net$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ukan.allianceconsultants.net;

    ssl_certificate /etc/letsencrypt/live/ukan.allianceconsultants.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ukan.allianceconsultants.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/ukan-access.log;
    error_log /var/log/nginx/ukan-error.log;

    client_max_body_size 1M;

    # Le site utilise des adresses avec barre finale (/le-reseau/) :
    # ne pas ajouter ici de règle qui la retire.
    location / {
        proxy_pass http://ukan_site;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
