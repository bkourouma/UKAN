# Nginx DANS le conteneur ukan-site : sert l'export statique de Next.js (out/).
# Le TLS et le nom de domaine sont gérés par le nginx de l'hôte
# (deploy/nginx-ukan.allianceconsultants.net.conf), qui relaie vers 127.0.0.1:3040.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives (/le-reseau → /le-reseau/) : le conteneur ne connaît
    # ni le domaine ni le port public, c'est le navigateur qui complète l'adresse.
    absolute_redirect off;

    # /le-reseau  →  /le-reseau/  →  /le-reseau/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Fichiers versionnés par Next.js : cache long
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Pages HTML : toujours revalidées, pour voir chaque déploiement aussitôt
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
